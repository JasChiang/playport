<svg xmlns="http://www.w3.org/2000/svg" width="910" height="370" viewBox="0 0 910 370" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>DuoHinge layouts on the iPhone Duo</title>
  <rect width="910" height="370" rx="16" fill="#0B0E13"/>
  <defs>
    <g id="abxy">
      <circle cx="0" cy="-11" r="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
      <circle cx="-11" cy="0" r="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
      <circle cx="11" cy="0" r="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
      <circle cx="0" cy="11" r="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    </g>
    <g id="stick">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#C9CED6"/>
    </g>
    <g id="abxy-on">
      <circle cx="0" cy="-9" r="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
      <circle cx="-9" cy="0" r="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
      <circle cx="9" cy="0" r="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
      <circle cx="0" cy="9" r="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
    </g>
    <g id="stick-on">
      <circle cx="0" cy="0" r="14" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#151A21"/>
    </g>
  </defs>

  <!-- 1. Inner screen upright, folded like a laptop or flat (669x951) -->
  <g transform="translate(30,24)">
    <rect x="-6" y="-6" width="212" height="297" rx="16" fill="#1E242D"/>
    <rect width="200" height="285" rx="10" fill="#000"/>
    <rect x="0" y="15" width="200" height="112" fill="#F5B544"/>
    <text x="100" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#151A21">Game</text>
    <line x1="-12" y1="142" x2="212" y2="142" stroke="#6B7480" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="10" y="152" width="34" height="14" rx="7" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="156" y="152" width="34" height="14" rx="7" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="10" y="172" width="34" height="14" rx="7" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="156" y="172" width="34" height="14" rx="7" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <use href="#stick" x="45" y="245"/>
    <use href="#abxy" x="155" y="245"/>
  </g>
  <text x="130" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#EEF1F5">Inner screen, upright</text>
  <text x="130" y="355" text-anchor="middle" font-size="12" fill="#9AA3AE">folded or flat: controls below the hinge</text>

  <!-- 2. Inner screen sideways (951x669) -->
  <g transform="translate(276,24)">
    <rect x="-6" y="-6" width="282" height="210" rx="16" fill="#1E242D"/>
    <rect width="270" height="198" rx="10" fill="#000"/>
    <rect x="0" y="0" width="270" height="152" fill="#F5B544"/>
    <text x="135" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#151A21">Game</text>
    <rect x="10" y="8" width="30" height="13" rx="6.5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
    <rect x="230" y="8" width="30" height="13" rx="6.5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
    <use href="#stick" x="40" y="168"/>
    <use href="#abxy" x="230" y="166"/>
  </g>
  <text x="411" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#EEF1F5">Inner screen, sideways</text>
  <text x="411" y="272" text-anchor="middle" font-size="12" fill="#9AA3AE">picture at the top; sticks and face</text>
  <text x="411" y="288" text-anchor="middle" font-size="12" fill="#9AA3AE">buttons mostly on the band below</text>

  <!-- 3. Cover screen upright, during a game (466x678) -->
  <g transform="translate(570,24)">
    <rect x="-6" y="-6" width="152" height="215" rx="16" fill="#1E242D"/>
    <rect width="140" height="203" rx="10" fill="#000"/>
    <rect x="0" y="0" width="140" height="79" fill="#F5B544"/>
    <text x="70" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#151A21">Game</text>
    <rect x="8" y="90" width="28" height="12" rx="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="104" y="90" width="28" height="12" rx="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="8" y="107" width="28" height="12" rx="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <rect x="104" y="107" width="28" height="12" rx="6" fill="none" stroke="#C9CED6" stroke-width="1.5"/>
    <use href="#stick" x="34" y="168"/>
    <use href="#abxy" x="106" y="168"/>
  </g>
  <text x="640" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#EEF1F5">Cover screen, upright</text>
  <text x="640" y="272" text-anchor="middle" font-size="12" fill="#9AA3AE">during a game: controls</text>
  <text x="640" y="288" text-anchor="middle" font-size="12" fill="#9AA3AE">below the picture</text>

  <!-- 4. Cover screen sideways (678x466) -->
  <g transform="translate(728,64)">
    <rect x="-6" y="-6" width="164" height="117" rx="14" fill="#1E242D"/>
    <rect width="152" height="105" rx="9" fill="#000"/>
    <rect x="0" y="0" width="152" height="86" fill="#F5B544"/>
    <text x="76" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#151A21">Game</text>
    <rect x="22" y="6" width="22" height="10" rx="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
    <rect x="108" y="6" width="22" height="10" rx="5" fill="#151A21" fill-opacity="0.35" stroke="#151A21" stroke-width="1.5"/>
    <use href="#stick-on" x="38" y="78"/>
    <use href="#abxy-on" x="114" y="76"/>
  </g>
  <text x="804" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#EEF1F5">Cover screen, sideways</text>
  <text x="804" y="232" text-anchor="middle" font-size="12" fill="#9AA3AE">controls over the picture,</text>
  <text x="804" y="248" text-anchor="middle" font-size="12" fill="#9AA3AE">the same margin on</text>
  <text x="804" y="264" text-anchor="middle" font-size="12" fill="#9AA3AE">both sides</text>
</svg>
